<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — AI Помічник</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center h-screen">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <h2 class="text-2xl font-bold mb-6 text-center text-indigo-400">Вхід до Закритого Клубу</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Логін</label>
                <input type="text" id="username" required 
                       class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Пароль</label>
                <input type="password" id="password" required 
                       class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
            </div>
            
            <div id="errorMessage" class="text-red-400 text-sm hidden text-center"></div>
            
            <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition-colors cursor-pointer">
                Увійти
            </button>
        </form>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
